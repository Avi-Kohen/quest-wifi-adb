name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name QuestWifiADB app.py

      - name: Add helper files to build folder
        shell: pwsh
        run: |
          Copy-Item README.md dist\QuestWifiADB\README.md -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist\QuestWifiADB\LICENSE.txt -ErrorAction SilentlyContinue
          @"
          ADB / Android platform-tools are NOT included in this build.

          To use this app on another Windows computer:
          1. Download Android SDK Platform-Tools from Google.
          2. Extract the folder.
          3. Put the folder named platform-tools next to QuestWifiADB.exe.

          Expected structure:

          QuestWifiADB/
          - QuestWifiADB.exe
          - platform-tools/
            - adb.exe
            - AdbWinApi.dll
            - AdbWinUsbApi.dll

          Then open QuestWifiADB.exe.
          "@ | Out-File -Encoding utf8 dist\QuestWifiADB\ADB-INSTRUCTIONS.txt

      - name: Zip build folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\QuestWifiADB -DestinationPath QuestWifiADB-Windows.zip -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestWifiADB-Windows
          path: QuestWifiADB-Windows.zip
